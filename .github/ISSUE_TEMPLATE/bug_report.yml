name: Bug report
description: Something Conductor did wrong, or Conductor affected work outside /conductor
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan and report output
      description: Paste the Conductor plan and report if there was one. Remove anything private.
      render: text
  - type: dropdown
    id: interference
    attributes:
      label: Did Conductor affect anything outside a /conductor invocation?
      options:
        - "No"
        - "Yes (release-blocking)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Conductor version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: cc-version
    attributes:
      label: Claude Code version
    validations:
      required: true
