name: Bug report
description: Something Tierly did wrong, or Tierly affected work outside /tierly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan and report output
      description: Paste the Tierly plan and report if there was one. Remove anything private.
      render: text
  - type: dropdown
    id: interference
    attributes:
      label: Did Tierly affect anything outside a /tierly invocation?
      options:
        - "No"
        - "Yes (release-blocking)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tierly version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: cc-version
    attributes:
      label: Claude Code version
    validations:
      required: true
