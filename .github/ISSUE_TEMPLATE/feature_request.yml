name: Feature request
description: Suggest a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with Tierly's principles
      options:
        - label: Works without hooks, settings changes, or auto-activation
          required: true
        - label: Keeps the user in control of spend (visible in the plan)
          required: true
