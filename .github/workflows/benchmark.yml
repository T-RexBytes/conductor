name: Benchmark

# Manual only: runs real Claude Code sessions and costs money.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Comma-separated task IDs (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run benchmark suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: "1"
          TASKS: ${{ github.event.inputs.tasks }}
        run: |
          if [ -n "$TASKS" ]; then
            python benchmarks/run_benchmark.py --tasks "$TASKS" --out benchmark-results.jsonl
          else
            python benchmarks/run_benchmark.py --out benchmark-results.jsonl
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.jsonl
